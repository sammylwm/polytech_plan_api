services:
  db:
    image: docker.io/library/postgres:17
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - polytech_api:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polytech_api:
