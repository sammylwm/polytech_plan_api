services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - default
      - shared
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:17
    env_file:
      - .env
    volumes:
      - polytech_plan:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  polytech_plan:
  media:

  
networks:
  shared:
    external: true
    name: poly-shared
